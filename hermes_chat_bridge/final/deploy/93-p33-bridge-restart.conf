# P33 OPTIONAL candidate only; not installed on user's machine.
# Install as ~/.config/systemd/user/hermes-bridge.service.d/93-p33-bridge-restart.conf
# after review, tests and explicit owner approval. 91-*.conf has Restart=no;
# this later-sorted file overrides that setting.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
Restart=on-failure
RestartSec=5s
